<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FitTrack — Fitness & Diet Tracker</title>
  <meta name="description" content="Track your fitness, diet, workouts and water intake with FitTrack">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏋️</text></svg>">
  <link rel="stylesheet" href="css/style.css" />
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

<!-- ===== AUTH WRAPPER ===== -->
<div id="auth-wrapper" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg)">
  <div id="auth-content" style="width:100%;max-width:520px;padding:20px"></div>
</div>

<!-- ===== APP WRAPPER ===== -->
<div id="app-wrapper" class="app-layout" style="display:none">

  <!-- SIDEBAR OVERLAY (mobile) -->
  <div id="sidebar-overlay" class="sidebar-overlay"></div>

  <!-- SIDEBAR -->
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">🏋️</div>
      <span>FitTrack</span>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section-label">Main</div>
      <div class="nav-item active" data-page="dashboard">
        <span class="nav-icon">📊</span> Dashboard
      </div>
      <div class="nav-item" data-page="diet">
        <span class="nav-icon">🥗</span> Diet Tracker
      </div>
      <div class="nav-item" data-page="workout">
        <span class="nav-icon">🏋️</span> Workouts
      </div>
      <div class="nav-item" data-page="water">
        <span class="nav-icon">💧</span> Water Intake
      </div>
      <div class="nav-item" data-page="goals">
        <span class="nav-icon">🎯</span> Goals & Progress
      </div>

      <div class="nav-section-label" style="margin-top:16px">Account</div>
      <div class="nav-item" data-page="profile">
        <span class="nav-icon">👤</span> Profile
      </div>
      <div class="nav-item" id="admin-nav-item" data-page="admin" style="display:none">
        <span class="nav-icon">🔐</span> Admin Panel
      </div>
      <div class="nav-item" data-page="logout">
        <span class="nav-icon">🚪</span> Logout
      </div>
    </nav>

    <div class="sidebar-footer">
      <div class="user-card" onclick="App.showPage('profile')">
        <div class="user-avatar" id="sidebar-avatar">U</div>
        <div class="user-card-info">
          <div class="user-card-name" id="sidebar-username">Loading...</div>
          <div class="user-card-email" id="sidebar-useremail"></div>
        </div>
      </div>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main-content">

    <!-- TOPBAR -->
    <header class="topbar">
      <button class="hamburger" id="hamburger-btn">☰</button>
      <div class="topbar-title" id="topbar-title">Dashboard</div>
      <div class="topbar-actions">
        <button class="notification-btn" id="notification-btn" title="Notifications">
          🔔
          <span class="notif-dot" id="notif-dot" style="display:none"></span>
        </button>
        <button class="theme-toggle" onclick="Theme.toggle()" title="Toggle theme">
          <span class="theme-toggle-icon">🌙</span>
        </button>
      </div>
    </header>

    <!-- PAGE CONTENT -->
    <div class="page-content" id="page-content">
      <!-- Dynamically rendered -->
    </div>

  </main>
</div>

<!-- ===== TOAST CONTAINER ===== -->
<div class="toast-container" id="toast-container"></div>

<!-- ===== SCRIPTS ===== -->
<script src="js/utils.js"></script>
<script src="js/app.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/diet.js"></script>
<script src="js/workout.js"></script>
<script src="js/pages.js"></script>

</body>
</html>
